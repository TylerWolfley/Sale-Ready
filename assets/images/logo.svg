<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>Sale Ready logo</title>
  <desc>Shield logo with stacked Sale Ready wordmark.</desc>
  <defs>
    <path id="shield" d="M86 96Q256 42 426 96L416 270Q414 347 370 399L256 470L142 399Q98 347 96 270Z" />
    <path id="banner" d="M54 218Q256 176 458 218L442 352Q256 308 70 352Z" />
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <use href="#shield" fill="#000000" stroke="#ffffff" stroke-width="28" stroke-linejoin="round" />
    <use href="#shield" fill="none" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
    <use href="#shield" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />

    <path d="M148 344Q256 326 364 344L256 432Z" fill="#000000" />

    <use href="#banner" fill="#ffffff" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
    <use href="#banner" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />

    <g fill="#000000" stroke="#ffffff" stroke-width="18" paint-order="stroke fill" stroke-linejoin="round" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" text-anchor="middle">
      <text x="256" y="202" font-size="134" letter-spacing="-6" transform="skewX(-6)">SALE</text>
      <text x="256" y="320" font-size="146" letter-spacing="-7" transform="skewX(-6)">READY</text>
    </g>
  </g>
</svg>
