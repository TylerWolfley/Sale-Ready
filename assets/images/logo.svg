<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title>Sale Ready logo</title>
  <desc>Stacked SALE READY wordmark on banner panels above a chevron mark.</desc>
  <defs>
    <style>
      .panel {
        fill: #fff;
        stroke: #111;
        stroke-linejoin: round;
        stroke-width: 14;
      }

      .chevron {
        fill: none;
        stroke: #111;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 24;
      }

      .wordmark {
        fill: #111;
        font-family: "Arial Black", Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        font-size: 220px;
        letter-spacing: 10px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <path class="panel" d="M254 160H946L974 486H226Z" />
  <path class="panel" d="M164 526H1036L1008 836L820 804H380L192 836Z" />
  <path class="chevron" d="M344 848L600 1004L856 848" />
  <path class="chevron" d="M274 828L600 1048L926 828" />

  <path d="M246 190H954" fill="none" stroke="#111" stroke-linecap="round" stroke-width="12" />
  <text class="wordmark" x="600" y="486">SALE</text>
  <text class="wordmark" x="600" y="778">READY</text>
</svg>
